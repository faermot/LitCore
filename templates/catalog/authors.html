{% extends 'base.html' %}
{% block title %}Авторы — LitCore{% endblock %}
{% block content %}
<h1 class="page-title">Авторы</h1>
<div class="authors-grid">
  {% for author in authors %}
    <a href="{{ author.get_absolute_url }}" class="author-card">
      <div class="author-card__photo">
        {% if author.photo %}
          <img src="{{ author.photo.url }}" alt="{{ author.name }}">
        {% else %}
          <div class="author-card__no-photo">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
        {% endif %}
      </div>
      <div class="author-card__name">{{ author.name }}</div>
      <div class="author-card__count">{{ author.book_count_str }}</div>
    </a>
  {% endfor %}
</div>
{% endblock %}
