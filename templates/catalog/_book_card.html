<div class="book-card" data-id="{{ book.id }}">
  <a href="{{ book.get_absolute_url }}" class="book-card__link">
    <div class="book-card__cover-wrap">
      {% if book.cover %}
        <img class="book-card__cover" src="{{ book.cover.url }}" alt="{{ book.title }}" loading="lazy">
      {% else %}
        <div class="book-card__no-cover">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
          </svg>
        </div>
      {% endif %}
      <div class="book-card__overlay">
        <p class="book-card__desc">{{ book.description|truncatechars:120 }}</p>
      </div>
    </div>
    <div class="book-card__info">
      <h3 class="book-card__title">{{ book.title }}</h3>
      <p class="book-card__authors">{{ book.authors.all|join:", " }}</p>
      {% if book.rating %}
        <div class="book-card__rating">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#FF6B35" stroke="none">
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
          </svg>
          {{ book.rating }}
        </div>
      {% endif %}
    </div>
  </a>
  <button class="fav-btn {% if book.id in favorite_ids %}fav-btn--active{% endif %}"
          data-book-id="{{ book.id }}"
          title="В избранное">
    <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="{% if book.id in favorite_ids %}#FF6B35{% else %}none{% endif %}">
      <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
    </svg>
  </button>
</div>
